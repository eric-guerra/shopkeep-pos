spring:
  datasource:
    url: jdbc:h2:mem:shopkeep;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # Flyway owns the schema
    properties:
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true

shopkeep:
  tax-rate: 0.0825
  zone: America/Chicago
